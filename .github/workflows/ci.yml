name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            arch: x64
            command: pnpm run dist:win
            asset: release/DeepSeek-Harness-Desktop-*-Windows-x64.exe
          - runner: macos-15
            platform: macos
            arch: arm64
            command: pnpm run dist:mac:arm64
            asset: release/DeepSeek-Harness-Desktop-*-macOS-arm64.dmg
          - runner: macos-15-intel
            platform: macos
            arch: x64
            command: pnpm run dist:mac:x64
            asset: release/DeepSeek-Harness-Desktop-*-macOS-x64.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify native runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if (process.arch !== process.env.EXPECTED_ARCH) { throw new Error('Expected ' + process.env.EXPECTED_ARCH + ', got ' + process.arch) }"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run typecheck
      - run: pnpm run build
      - name: Build installer
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14
